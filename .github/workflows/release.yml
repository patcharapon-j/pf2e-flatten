name: Release

# Manually-triggered release workflow. Run it from the Actions tab, supply the
# version to publish, and it will tag the repository, build the module archive,
# and publish a GitHub Release whose assets back the manifest/download links.
on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release (semver, without a leading v) — e.g. 1.0.1"
        required: true
        type: string

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Resolve version and URLs
        id: meta
        run: |
          VERSION="${{ inputs.version }}"
          VERSION="${VERSION#v}"
          REPO="${{ github.repository }}"
          {
            echo "version=$VERSION"
            echo "tag=v$VERSION"
            echo "manifest=https://github.com/$REPO/releases/latest/download/module.json"
            echo "download=https://github.com/$REPO/releases/download/v$VERSION/module.zip"
          } >> "$GITHUB_OUTPUT"

      - name: Stamp module.json
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require("fs");
            const path = "module.json";
            const manifest = JSON.parse(fs.readFileSync(path, "utf8"));
            manifest.version = "${{ steps.meta.outputs.version }}";
            manifest.manifest = "${{ steps.meta.outputs.manifest }}";
            manifest.download = "${{ steps.meta.outputs.download }}";
            fs.writeFileSync(path, JSON.stringify(manifest, null, 2) + "\n");

      - name: Build module archive
        run: zip -r module.zip module.json scripts lang README.md LICENSE CHANGELOG.md

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.meta.outputs.tag }}
          name: ${{ steps.meta.outputs.tag }}
          draft: false
          prerelease: false
          generate_release_notes: true
          files: |
            module.json
            module.zip
